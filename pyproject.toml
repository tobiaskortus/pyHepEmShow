[build-system]
requires = ["setuptools>=64", "nanobind", "tomli; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhepemshow"
version = "0.1.0"
requires-python = ">=3.8"

[tool.setuptools]
py-modules = []

[tool.pyhepemshow]
# Build type passed to CMake for the hepemshow extension.
# Either: "Debug" or "Release"
build_type = "Release"
